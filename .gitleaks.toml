# Gitleaks — cegah secret bocor ke repo (PRD §16).
# Install: https://github.com/gitleaks/gitleaks  lalu:
#   gitleaks protect --staged   (cek sebelum commit)
# Lihat docs/deployment/staging.md untuk hook pre-commit.

[extend]
useDefault = true

[allowlist]
description = "Contoh placeholder di .env.example — bukan secret asli"
paths = ["apps/backend/.env.example", "apps/frontend/.env.example", "packages/database/.env.example"]
regexes = ["USER:PASSWORD", "your-anon-key-here", "your-service-role-key-here",
  "generate-dengan-secrets", "xxx\\.supabase\\.co"]
